# .github/workflows/deploy.yml
#
# Build & Deploy: Lentago Labs landing (lentago.dev) → ECR → ECS Fargate
#
# Thin caller for the shared site-deploy reusable workflow. The full pipeline
# (Astro build, Trivy scan, build-provenance attestation, ECS roll) lives in:
#   lentago/shared-workflows/.github/workflows/site-deploy.yml @ v1.1.0
#
# This repo deploys the Astro static site as an nginx container to the
# solidago platform (ECR repo: solidago-dev-lentago, ECS service:
# solidago-dev-lentago). Provisioned 2026-06-30; resources renamed from
# foundry-dev-* to solidago-dev-* on 2026-07-08 (solidago #102).

name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      id-token: write      # OIDC — AWS auth + attestation signing
      contents: read
      attestations: write  # store build provenance in GitHub's attestation store
      packages: read       # required by actions/attest-build-provenance
    uses: lentago/shared-workflows/.github/workflows/site-deploy.yml@v1.1.0
    with:
      ecr_repo: solidago-dev-lentago
      ecs_cluster: solidago-dev-cluster
      ecs_service: solidago-dev-lentago
      role_arn: arn:aws:iam::365184644049:role/solidago-dev-github-actions
      aws_region: us-east-1
      node_version: "20"
