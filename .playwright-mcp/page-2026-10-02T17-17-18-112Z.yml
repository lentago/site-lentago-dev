  - generic [ref=e358]:
    - generic [ref=e359]:
      - generic [ref=e360]: ◆Operating principles
      - heading "How we think about production." [level=2] [ref=e361]
      - paragraph [ref=e362]: The full runbook is longer, drier, and in the repo. These are the six we'd bring into a room on day one.
    - generic [ref=e363]:
      - generic [ref=e364]:
        - generic [ref=e365]: "01"
        - heading "Build it, break it, operate it." [level=3] [ref=e366]
        - paragraph [ref=e367]: The person who designs the system is the person who carries the pager for it. Otherwise the design is a suggestion, not a commitment.
      - generic [ref=e368]:
        - generic [ref=e369]: "02"
        - heading "Blast radius over blast capacity." [level=3] [ref=e370]
        - paragraph [ref=e371]: Least-privilege isn't a checkbox — it's the default. If a compromised pipeline can reach production, the problem is the pipeline, not the compromise.
      - generic [ref=e372]:
        - generic [ref=e373]: "03"
        - heading "Runbooks beat heroics." [level=3] [ref=e374]
        - paragraph [ref=e375]: An incident handled by a sleepy engineer following the runbook is better than a hero who remembers. Write the doc. Update it when it lies.
      - generic [ref=e376]:
        - generic [ref=e377]: "04"
        - heading "Observable from day one." [level=3] [ref=e378]
        - paragraph [ref=e379]: You cannot operate what you cannot see. Logs, metrics, traces, and a single dashboard a human actually opens. No 'we'll add it later.'
      - generic [ref=e380]:
        - generic [ref=e381]: "05"
        - heading "Plan on PR. Apply on merge." [level=3] [ref=e382]
        - paragraph [ref=e383]: Infrastructure changes are code review. OIDC, no long-lived credentials, signed artifacts. The pipeline is the contract.
      - generic [ref=e384]:
        - generic [ref=e385]: "06"
        - heading "Cost is a posture." [level=3] [ref=e386]
        - paragraph [ref=e387]: A NAT gateway you forgot about is a security problem. A forgotten log bucket is a compliance problem. Run the audit monthly, not yearly.
  - generic [ref=e390]:
    - generic [ref=e391]:
      - generic [ref=e392]: ◆About
      - heading "Nearly thirty years carrying the pager." [level=2] [ref=e393]
      - paragraph [ref=e394]: "I've kept production running around the clock since 1997: first in server rooms where every change had physical consequences, now in cloud systems defined entirely in code. These days I help organizations that run on donations run that same kind of reliable setup on infrastructure they own, and I do it in the open."
      - generic [ref=e395]:
        - generic [ref=e396]: "Based: New England, US"
        - generic [ref=e397]: "Working: remote · async-friendly"
        - generic [ref=e398]: "Taking new work: Q4 2026 forward"
    - generic [ref=e399]:
      - generic [ref=e401]:
        - generic [ref=e403]: 2022 —
        - heading "Moving the discipline; keeping the rigor" [level=3] [ref=e405]
        - paragraph [ref=e406]: "Moved to cloud-native work: infrastructure written as code, every change reviewed where the whole team can see it. The tools changed; the habits didn't. Rehearse the failure, write down the fix, make the next change boring. Lentago is where I practice those habits in the open, on an estate anyone can copy."
      - generic [ref=e407]:
        - generic [ref=e409]: 2017 — 2021
        - heading "Internet engineering; public cloud" [level=3] [ref=e411]
        - paragraph [ref=e412]: A much larger company bought us and put real money behind the platform. I ran disaster-recovery drills, cut recovery times, and made every component within reach redundant. Led the capacity buildout team, with a lot of vendor evaluation along the way. The job grew to cover internet routing, large email domains, DNS, CDNs, and cloud integrations.
      - generic [ref=e413]:
        - generic [ref=e415]: 2007 — 2016
        - heading "Operator number three at a startup; IPO five years later" [level=3] [ref=e417]
        - paragraph [ref=e418]: "Joined a small startup of fewer than 50 people in 2007 as its third infrastructure operator. Each instance of the platform was hardware we designed and racked ourselves: load balancers, storage, layers of network switching, one cabinet at first and later several. I made the buildouts repeatable and added redundancy wherever it would fit. Every hardware generation changed something, so I used configuration management and orchestration to keep those differences away from the support team."
      - generic [ref=e419]:
        - generic [ref=e421]: 1997 — 2006
        - heading "Graveyard shift to principal; left it better than I found it" [level=3] [ref=e423]
        - paragraph [ref=e424]: "Started as the overnight operator: data-center keys, orders to change the backup tapes, and escalations from support. I learned AIX and VMS from the career sysadmins I'd just woken for the third time that night, and never called anyone about the same thing twice. I earned the day shift by doing a full sysadmin's job on nights, trained my own replacement, and kept leading the night shift from days. By 2005 I was a principal operator who'd brought two new data centers from construction to production."
