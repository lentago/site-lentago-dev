        - generic [ref=e211]: "01"
        - heading "Client-owned repos" [level=3] [ref=e212]
        - paragraph [ref=e213]: Every kit ships as a repository you own from day one — a template plus an engagement, in open formats. Not a tenancy on ours.
      - generic [ref=e214]:
        - generic [ref=e215]: "02"
        - heading "Runs in your accounts" [level=3] [ref=e216]
        - paragraph [ref=e217]: Anything that runs continuously runs in your accounts on free tiers — your GitHub Actions, your static host, your Grafana free tier. We don't host it.
      - generic [ref=e218]:
        - generic [ref=e219]: "03"
        - heading "No multi-tenancy" [level=3] [ref=e220]
        - paragraph [ref=e221]: We never operate one system serving many organizations. No shared endpoints, no pooled data, no custody of your records.
