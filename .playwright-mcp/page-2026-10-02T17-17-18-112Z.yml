    - generic [ref=e331]:
      - generic [ref=e332]:
        - generic [ref=e333]: ◆Custom help
        - heading "When the work isn't a kit." [level=2] [ref=e334]
      - paragraph [ref=e335]: Not everything is a template. Custom work — audits, migrations, incident response, hardening — sized to your constraints and delivered into your estate under the same pledge. Free for nonprofits and volunteer-run organizations; everyone else, ask. Never a subscription to something we run.
    - generic [ref=e336]:
      - generic [ref=e337]:
        - generic [ref=e338]: AUDIT
        - heading "Cost & posture audits" [level=3] [ref=e339]
        - paragraph [ref=e340]: Find the NAT gateway eating the budget; the IAM role nobody owns; the bucket with forgotten logs. One-page report, no theatre.
      - generic [ref=e341]:
        - generic [ref=e342]: MIGRATION
        - heading "Cloud & datacenter migrations" [level=3] [ref=e343]
        - paragraph [ref=e344]: Bare metal through cloud-native, and the platform shifts in between — moved without losing the rigor or a customer-visible outage.
      - generic [ref=e345]:
        - generic [ref=e346]: ONCALL
        - heading "Incident response & on-call" [level=3] [ref=e347]
        - paragraph [ref=e348]: Runbooks, alarms, and on-call rotations humans can live with. Service targets that reflect reality, not aspiration. Pager hygiene included.
      - generic [ref=e349]:
        - generic [ref=e350]: CI/CD
        - heading "CI/CD & supply-chain hardening" [level=3] [ref=e351]
        - paragraph [ref=e352]: Deploy pipelines with no stored passwords, every change reviewed before it applies, and signed builds — so a compromised pipeline can only reach what it was allowed to.
