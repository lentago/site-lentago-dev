        - generic [ref=e204]: ◆The pledge
        - heading "We will never host your systems for you." [level=2] [ref=e205]
      - generic [ref=e206]:
        - paragraph [ref=e207]: You'll own every piece. We'll show your people how to run it. Firing us is a runbook — a fork, not a migration off a service we run.
        - paragraph [ref=e208]: An anti-lock-in practice is only believable if walking away is trivial. So the boundary isn't a promise — it's the standing delivery model, true by construction.
    - generic [ref=e209]:
