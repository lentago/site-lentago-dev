      - generic [ref=e189]:
        - paragraph [ref=e190]: You'll own every piece. We'll show your people how to run it. Firing us is a runbook — a fork, not a migration off a service we run.
        - paragraph [ref=e191]: An anti-lock-in practice is only believable if walking away is trivial. So the boundary isn't a promise — it's the standing delivery model, true by construction.
