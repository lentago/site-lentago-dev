  - generic [ref=e341]:
    - generic [ref=e342]:
      - generic [ref=e343]: ◆Operating principles
      - heading "How we think about production." [level=2] [ref=e344]
      - paragraph [ref=e345]: The full runbook is longer, drier, and in the repo. These are the six we'd bring into a room on day one.
    - generic [ref=e346]:
      - generic [ref=e347]:
        - generic [ref=e348]: "01"
        - heading "Build it, break it, operate it." [level=3] [ref=e349]
        - paragraph [ref=e350]: The person who designs the system is the person who carries the pager for it. Otherwise the design is a suggestion, not a commitment.
      - generic [ref=e351]:
        - generic [ref=e352]: "02"
        - heading "Blast radius over blast capacity." [level=3] [ref=e353]
        - paragraph [ref=e354]: Least-privilege isn't a checkbox — it's the default. If a compromised pipeline can reach production, the problem is the pipeline, not the compromise.
      - generic [ref=e355]:
        - generic [ref=e356]: "03"
        - heading "Runbooks beat heroics." [level=3] [ref=e357]
        - paragraph [ref=e358]: An incident handled by a sleepy engineer following the runbook is better than a hero who remembers. Write the doc. Update it when it lies.
      - generic [ref=e359]:
        - generic [ref=e360]: "04"
        - heading "Observable from day one." [level=3] [ref=e361]
        - paragraph [ref=e362]: You cannot operate what you cannot see. Logs, metrics, traces, and a single dashboard a human actually opens. No 'we'll add it later.'
      - generic [ref=e363]:
        - generic [ref=e364]: "05"
        - heading "Plan on PR. Apply on merge." [level=3] [ref=e365]
        - paragraph [ref=e366]: Infrastructure changes are code review. OIDC, no long-lived credentials, signed artifacts. The pipeline is the contract.
      - generic [ref=e367]:
        - generic [ref=e368]: "06"
        - heading "Cost is a posture." [level=3] [ref=e369]
        - paragraph [ref=e370]: A NAT gateway you forgot about is a security problem. A forgotten log bucket is a compliance problem. Run the audit monthly, not yearly.
