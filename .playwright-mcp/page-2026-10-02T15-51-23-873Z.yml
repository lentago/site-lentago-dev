        - generic [ref=e316]: ◆Custom help
        - heading "When the work isn't a kit." [level=2] [ref=e317]
      - paragraph [ref=e318]: Not everything is a template. Custom work — audits, migrations, incident response, hardening — sized to your constraints and delivered into your estate under the same pledge. Free for nonprofits and volunteer-run organizations; everyone else, ask. Never a subscription to something we run.
    - generic [ref=e319]:
      - generic [ref=e320]:
        - generic [ref=e321]: AUDIT
        - heading "Cost & posture audits" [level=3] [ref=e322]
        - paragraph [ref=e323]: Find the NAT gateway eating the budget; the IAM role nobody owns; the bucket with forgotten logs. One-page report, no theatre.
      - generic [ref=e324]:
        - generic [ref=e325]: MIGRATION
        - heading "Cloud & datacenter migrations" [level=3] [ref=e326]
        - paragraph [ref=e327]: Bare metal through cloud-native, and the platform shifts in between — moved without losing the rigor or a customer-visible outage.
      - generic [ref=e328]:
        - generic [ref=e329]: ONCALL
        - heading "Incident response & on-call" [level=3] [ref=e330]
        - paragraph [ref=e331]: Runbooks, alarms, and on-call rotations humans can live with. Service targets that reflect reality, not aspiration. Pager hygiene included.
      - generic [ref=e332]:
        - generic [ref=e333]: CI/CD
        - heading "CI/CD & supply-chain hardening" [level=3] [ref=e334]
        - paragraph [ref=e335]: Deploy pipelines with no stored passwords, every change reviewed before it applies, and signed builds — so a compromised pipeline can only reach what it was allowed to.
