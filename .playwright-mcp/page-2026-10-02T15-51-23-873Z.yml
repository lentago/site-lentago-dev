      - generic [ref=e391]:
        - generic [ref=e393]:
          - generic [ref=e394]: 2015 — 2023
          - generic [ref=e395]: SALESFORCE
        - heading "Internet engineer" [level=3] [ref=e396]
        - paragraph [ref=e397]: Principal through Salesforce's 2016 purchase of Demandware, its first e-commerce product. Ran disaster-recovery drills, cut recovery times, and made every component within reach redundant. Led the capacity buildout team, with a lot of vendor evaluation along the way. The job grew to cover internet routing, large email domains, DNS, and cloud workloads in Terraform. In 2022 I moved to Salesforce's government cloud and ran my first Kubernetes, years late.
      - generic [ref=e398]:
        - generic [ref=e400]:
          - generic [ref=e401]: 2005 — 2015
          - generic [ref=e402]: DEMANDWARE
        - heading "Operator number three" [level=3] [ref=e403]
        - paragraph [ref=e404]: "Joined Demandware in 2007 as its third technical operator. Each instance of the platform was hardware we designed and racked ourselves: load balancers, storage, layers of network switching, one cabinet at first and later several. I made the buildouts repeatable and added redundancy wherever it would fit. Every hardware generation changed something, so I used configuration management and orchestration (code that sets every machine up the same way) to keep those differences away from the support team. That platform still runs."
      - generic [ref=e405]:
        - generic [ref=e407]:
          - generic [ref=e408]: 1997 — 2005
          - generic [ref=e409]: LIGHTBRIDGE
        - heading "Started on the graveyard shift" [level=3] [ref=e410]
        - paragraph [ref=e411]: Overnight customer support first. I solved enough on my own, without waking Operations, that they recruited me. Same graveyard shift, now with data-center keys and orders to change the backup tapes, learning AIX and VMS from the sysadmins I'd just woken for the third time that night. I never called anyone about the same thing twice. By 2005 I was a principal operator who'd brought two new data centers from construction to production.
