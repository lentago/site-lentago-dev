<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lentago Labs — business card</title>
<!-- Same tokens and self-hosted fonts the site ships. Nothing here is restated. -->
<link rel="stylesheet" href="../../public/design-system/tokens/colors.css">
<link rel="stylesheet" href="../../public/design-system/tokens/fonts.css">
<style>
  /* Print geometry: US 3.5 × 2 in trim, 0.125 in bleed on every side, and a
     0.125 in safe inset inside the trim. The PDF page is the bleed box. */
  /* GEOMETRY — render.sh rewrites the next two lines per printer profile (see
     PROFILES there). Default: 0.125 in bleed → a 3.75 × 2.25 in page. */
  :root { --bleed: 0.125in; --page-w: 3.75in; --page-h: 2.25in; }
  @page { size: 3.75in 2.25in; margin: 0; }
  :root {
    --safe: 0.125in;
    --font-display: 'Space Grotesk', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-display);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }

  .face {
    position: relative; overflow: hidden; box-sizing: border-box;
    width: var(--page-w); height: var(--page-h);
    break-after: page;
  }
  .face:last-child { break-after: auto; }
  .content { position: absolute; inset: calc(var(--bleed) + var(--safe)); }

  /* ---- Front: a deep-teal band bleeding off the left edge carries the chip
         mark over faint contours (the brand's dark-surface treatment); the
         limestone column beside it stays flat paper. ---------------------- */
  :root { --band-w: calc(1.055in + var(--bleed)); } /* 1.055 in visible after trim, whatever the bleed */
  .front { background: var(--color-bg); color: var(--color-ink); }
  .band {
    position: absolute; left: 0; top: 0; bottom: 0; width: var(--band-w);
    background: var(--color-brand-deep); overflow: hidden;
  }
  .band .contours { position: absolute; inset: 0; width: 100%; height: 100%; }
  .band .chip {
    position: absolute; left: 50%; top: 50%; width: 0.6in; height: 0.6in;
    transform: translate(-50%, -50%);
  }
  .front .content {
    left: calc(var(--band-w) + 0.26in);
    display: flex; flex-direction: column; justify-content: center;
  }
  .name { font-weight: 700; font-size: 15pt; letter-spacing: -0.02em; line-height: 1.05; margin: 0 0 3pt; }
  .role { font-size: 7.4pt; line-height: 1.35; color: var(--color-ink-muted); margin: 0 0 10pt; max-width: 1.9in; }
  .person { font-weight: 700; font-size: 8pt; letter-spacing: -0.01em; margin: 0 0 1pt; }
  .contact { font-family: var(--font-mono); font-size: 7.4pt; line-height: 1.7; margin: 0; }
  .contact .dim { color: var(--color-ink-muted); }

  /* ---- Back: the hero's dark field — contours, a ghost blossom bleeding off
         the corner, and the field prompt. Gold lives in the ▲ only. Solid teal,
         not the hero gradient: narrow gradients band on digital presses, and
         the textures sit a step stronger than on screen so they survive CMYK. */
  .back { background: var(--color-brand-deep); color: var(--color-on-dark); }
  .back .content { display: flex; flex-direction: column; justify-content: center; }
  .contours, .watermark { position: absolute; pointer-events: none; }
  .contours { inset: 0; width: 100%; height: 100%; }
  .watermark { width: 2.3in; height: 2.3in; right: -0.85in; bottom: -1.05in; opacity: 0.14; }
  .prompt { font-family: var(--font-mono); font-size: 9.5pt; line-height: 1.8; margin: 0; position: relative; }
  .prompt .glyph { display: inline-block; width: 0.62em; height: 0.62em; vertical-align: -0.02em; margin-right: 0.55em; }
  .prompt .cmd { font-weight: 600; }
  .prompt .out { color: var(--color-on-dark-soft); padding-left: 1.17em; }
  .corner {
    position: absolute; right: 0; bottom: 0; text-align: right;
    font-family: var(--font-mono); font-size: 6.5pt; /* CORNER-SIZE */ line-height: 1.6;
    color: var(--color-on-dark-muted);
  }

  /* ---- Screen preview only: stack the faces and draw trim + safe guides --- */
  @media screen {
    body { background: #6b6b66; display: grid; gap: 0.4in; padding: 0.5in; justify-content: start; }
    .face { box-shadow: 0 2px 14px rgba(0,0,0,0.45); }
    .guide { position: absolute; pointer-events: none; }
    .guide.trim { inset: var(--bleed); outline: 1px dashed rgba(220,40,40,0.7); }
    .guide.safe { inset: calc(var(--bleed) + var(--safe)); outline: 1px dotted rgba(40,120,220,0.7); }
    .legend { font: 11px/1.5 var(--font-mono); color: #eee; }
  }
  @media print { .guide, .legend { display: none; } }
</style>
</head>
<body>
