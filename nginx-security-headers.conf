# Shared security-header set, `include`d in nginx.conf's server scope AND
# re-`include`d inside every location block that declares its own add_header —
# nginx does NOT inherit add_header into a child scope that sets one of its
# own, so a location with a single add_header silently drops everything set
# above it. `include`ing this file re-adds the full set instead of relying on
# each location to remember to repeat it by hand.
#
# server_tokens is a normal (non add_header) directive and inherits fine, so
# it only needs to appear once per server{} block — declaring it again inside
# a location here is harmless (same value), not required.
server_tokens off;

# X-Frame-Options DENY: this site never frames its own or third-party content
# (no <iframe> anywhere in src/) — frame-ancestors 'none' in the CSP below
# mirrors this.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Report-Only, not enforcing: this is a live public site and this policy is
# drafted from what the build actually loads, not yet observed against real
# traffic. 'unsafe-inline' on style-src covers the embedded <style> blocks
# (Shared.jsx, Layout.astro) and the inline style="" attributes used
# throughout (e.g. thanks.astro); data: on img-src covers the inline SVG
# chevron background-image in Shared.jsx. No script-src exception — the site
# ships no JS at all (server-rendered React, no client:* directives).
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; form-action 'self' https://formspree.io; base-uri 'self'; frame-ancestors 'none'; object-src 'none'" always;
